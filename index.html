<style id="bingo-css">
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --ink:#15201B; --muted:#56655D; --line:#D3DCD6;
  --green:#1D6A50; --green-ink:#FFFFFF; --green-soft:#E0EDE6; --yellow:#E3A800; --yellow-soft:#FFF3C7;
  --screen:#0B1511; --eye:#7CF0C0; --wheel:#26332D; --danger:#B3261E;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#16201B; --ink:#E4ECE7; --muted:#9AAAA1; --line:#2B3933;
    --green:#5DBE95; --green-ink:#0E1512; --green-soft:#1A2D25; --yellow:#F2C230; --yellow-soft:#2E2812;
    --screen:#050A08; --eye:#8DF5C9; --wheel:#3A4943; --danger:#F2847C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --ink:#E4ECE7; --muted:#9AAAA1; --line:#2B3933;
  --green:#5DBE95; --green-ink:#0E1512; --green-soft:#1A2D25; --yellow:#F2C230; --yellow-soft:#2E2812;
  --screen:#050A08; --eye:#8DF5C9; --wheel:#3A4943; --danger:#F2847C; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img,svg{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--green)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:700;letter-spacing:-0.01em}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:0 0 auto}
.brand-mark{width:30px;height:30px}
.brand-name{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-0.02em}
.brand-name span{color:var(--green)}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none;justify-content:flex-end}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:500;font-size:.93rem;padding:6px 12px;border-radius:999px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--green-soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.edit-toggle{flex:0 0 auto;font:inherit;font-size:.88rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.edit-toggle:hover{border-color:var(--green)}
@media (max-width:760px){
  .top-row{flex-wrap:wrap;gap:8px 12px}
  .nav{order:3;flex-basis:100%;justify-content:flex-start;margin-inline:-4px}
  .edit-toggle{margin-left:auto}
}
main{padding-block:40px 120px}
section.page{display:grid;gap:40px}
.page-head{display:grid;gap:10px;max-width:68ch}
.page-head p{color:var(--muted);font-size:1.05rem}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(3.4rem,11vw,7rem);font-weight:800;letter-spacing:-0.04em;line-height:.9}
.hero h1 span{color:var(--green)}
.hero-copy{display:grid;gap:18px}
.hero-lead{font-size:clamp(1.1rem,2.2vw,1.3rem);max-width:34ch;line-height:1.45}
.hero-art{justify-self:center;width:100%;max-width:340px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:.95rem;text-decoration:none;padding:10px 16px;border-radius:10px;border:1px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn.danger{border-color:var(--danger);color:var(--danger)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-art{max-width:240px;grid-row:1}}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.hud div{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:2px}
.hud div:last-child{border-right:0}
.hud b{font-family:var(--mono);font-weight:500;font-size:.98rem}
@media (max-width:760px){.hud div{border-right:0;border-bottom:1px solid var(--line)}.hud div:last-child{border-bottom:0}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.prose{display:grid;gap:14px;max-width:66ch}
.prose p{font-size:1.02rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;align-content:start}
.panel.soft{background:var(--green-soft);border-color:transparent}
.panel.note{background:var(--yellow-soft);border-color:transparent}
ul.clean{margin:0;padding-left:1.2em;display:grid;gap:6px}
ol.clean{margin:0;padding-left:1.4em;display:grid;gap:8px}
.team-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.team-no{font-family:var(--mono);font-size:.95rem;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;align-content:start}
.avatar{width:56px;height:56px;border-radius:14px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.member-name{font-family:var(--display);font-weight:700;font-size:1.15rem}
.badge{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--yellow);color:#1b1500;font-weight:500;justify-self:start}
.member-role{color:var(--muted);font-size:.95rem}
.socials{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.socials a{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-family:var(--mono);padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink);transition:border-color .15s}
.socials a:hover{border-color:var(--green);color:var(--green)}
.socials .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.socials .dot.li{background:#0A66C2}
.socials .dot.gh{background:#333}
.socials .dot.rg{background:#00CCBB}
.objective{font-family:var(--display);font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:500;line-height:1.35;max-width:40ch}
.rq{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:18px 0;border-top:1px solid var(--line)}
.rq:last-child{border-bottom:1px solid var(--line)}
.rq-id{font-family:var(--mono);font-weight:500;color:var(--green);font-size:.95rem;padding-top:2px}
.rq p{font-size:1.08rem;max-width:62ch}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.group td{background:var(--green-soft);font-family:var(--mono);font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--green);font-weight:500;padding-block:7px}
tr.total td{font-weight:600;border-top:2px solid var(--ink)}
.tag{font-family:var(--mono);font-size:.7rem;padding:2px 6px;border-radius:5px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.tag.est{background:transparent;border:1px solid var(--line);color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.step{padding:20px;display:grid;gap:8px;align-content:start;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.step:nth-child(3n){border-right:0}
.step:nth-last-child(-n+3){border-bottom:0}
.step-n{font-family:var(--mono);font-size:.8rem;color:var(--green);font-weight:500}
.step h3{font-size:1.1rem}
.step p{color:var(--muted);font-size:.95rem}
@media (max-width:760px){.flow{grid-template-columns:1fr}.step{border-right:0}.step:nth-last-child(-n+3){border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}}
.arch{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
.arch-link{display:grid;place-items:center;text-align:center;font-family:var(--mono);font-size:.78rem;color:var(--muted);gap:6px}
.arch-link .wire{width:2px;height:100%;min-height:40px;background:repeating-linear-gradient(var(--green) 0 6px,transparent 6px 11px)}
@media (max-width:760px){.arch{grid-template-columns:1fr}.arch-link .wire{height:30px;min-height:30px}}
.chip-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.86rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.papers{display:grid;gap:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:8px}
.paper-title{font-weight:600;font-size:1.02rem;line-height:1.4}
.paper-meta{font-size:.88rem;color:var(--muted)}
.paper-row{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:.93rem}
.paper-row dt{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.paper-row dd{margin:0}
@media (max-width:560px){.paper-row{grid-template-columns:1fr}}
.group-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;padding-top:8px}
.empty{color:var(--muted);font-style:italic;padding:14px 0}
.member-acc{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.member-acc[open]{border-color:var(--green)}
.member-acc > summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:14px;user-select:none;transition:background .15s}
.member-acc > summary::-webkit-details-marker{display:none}
.member-acc > summary:hover{background:var(--green-soft)}
.member-acc[open] > summary{background:var(--green-soft);border-bottom:1px solid var(--line)}
.member-acc .acc-avatar{flex:0 0 auto;width:44px;height:44px;border-radius:11px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem;overflow:hidden}
.member-acc .acc-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.member-acc[open] .acc-avatar{background:var(--surface)}
.member-acc .acc-title{flex:1 1 auto;display:grid;gap:2px;min-width:0}
.member-acc .acc-name{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.2}
.member-acc .acc-sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member-acc .acc-count{flex:0 0 auto;font-family:var(--mono);font-size:.82rem;color:var(--green);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.member-acc[open] .acc-count{background:var(--surface)}
.member-acc .acc-caret{flex:0 0 auto;transition:transform .2s;color:var(--muted);font-size:1.1rem;line-height:1}
.member-acc[open] .acc-caret{transform:rotate(90deg);color:var(--green)}

.paper-title-btn{background:none;border:none;padding:0;margin:0;font:inherit;font-weight:600;font-size:1.02rem;line-height:1.4;color:var(--green);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}

.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(10,20,15,.55);display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:min(720px,100%);max-height:min(85vh,860px);width:100%;display:grid;grid-template-rows:auto 1fr;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line);background:var(--bg)}

.modal-head .eyebrow{margin-bottom:4px}
.modal-close{flex:0 0 auto;font:inherit;font-size:1.4rem;line-height:1;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.modal-close:hover{border-color:var(--danger);color:var(--danger)}
.modal-body{padding:22px;overflow-y:auto;display:grid;gap:16px}
.modal-body h4{font-family:var(--mono);font-weight:500;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--green);margin:0 0 4px}
.modal-body p{font-size:.98rem;line-height:1.6}
.modal-body ul{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:.96rem}

.modal-foot{padding:14px 22px;border-top:1px solid var(--line);background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timeline{display:grid;gap:18px}
.update{display:grid;grid-template-columns:150px 1fr;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.update-when{display:grid;gap:4px;align-content:start}
.update-week{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.2}
.update-body{display:grid;gap:16px}
.update-body h4{margin:0 0 6px;font-family:var(--mono);font-weight:500;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.form{display:grid;gap:12px;background:var(--surface);border:1px dashed var(--green);border-radius:14px;padding:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.field.full{grid-column:1/-1}
input[type=text],input[type=url],input[type=date],select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--ink)}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.editbar-row{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.editbar p{font-size:.92rem}
.editbar .btn{border-color:var(--bg);color:var(--bg)}
.editbar .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1b1500}
.editbar .btn[disabled]{opacity:.55;cursor:default}
.notice{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:40;max-width:min(560px,calc(100% - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:.92rem;box-shadow:0 8px 30px rgba(0,0,0,.18)}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:.88rem}

.r-body{fill:var(--green)}
.r-rib{stroke:var(--green-ink);stroke-opacity:.25;stroke-width:3}
.r-lid{fill:var(--yellow)}
.r-chassis{fill:var(--ink)}
.r-wheel{fill:var(--wheel)}
.r-hub{fill:var(--bg)}
.r-screen{fill:var(--screen)}
.r-eye{fill:var(--eye);transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}

.r-motion{stroke:var(--muted);stroke-width:3;stroke-linecap:round}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){.r-eye{animation:none}}
</style>
</head>

   "id": "i1",
   "owner": "m1",
   "title": "Encountering Autonomous Robots on Public Streets",
   "authors": "Pelikan, Reeves, Cantarutti",
   "venue": "HRI 2024, pp. 561 to 571",
   "year": "2024",
   "link": "https://dl.acm.org/doi/10.1145/3610977.3634936",
   "hri24": true,
   "summary": "Field study of how people actually respond to autonomous delivery robots on city streets, including the small, fleeting reactions most HRI studies ignore.",
   "relevance": "Robots get through streets mostly because people make room for them. BinGo's movement must be easy to read and can't assume people will always step aside.",
   "writeup": {
    "objective": "To understand how people actually respond to autonomous delivery robots in everyday street life, including the small, fleeting reactions that most HRI studies ignore.",
    "methods": "Video observation of autonomous delivery robots on public streets, with detailed analysis of pedestrian responses over many encounters.",
    "results": "The most common responses were subtle adjustments and ignoring the robot entirely, not direct interaction. Pedestrians stepped aside, workers moved things out of the way, and some people even pressed crossing buttons for the robots. Robot movement was sometimes hard to read, which created awkward moments.",
    "conclusions": "Robots get through the streets mostly because people make room for them. Robot movement was sometimes hard to read, which created awkward moments.",
    "limitations": "Focused on delivery robots on public streets rather than indoor campus environments."}
  },

    "methods": "The system uses a Raspberry Pi 4B-based robotic rover equipped with LiDAR, IMU, proximity sensors, a load cell, DC motors, and a camera. LiDAR and IMU are used for indoor navigation and obstacle avoidance, while the proximity sensor helps with docking. After waste transfer, a moisture sensor separates waste into wet and dry categories. The system also uses Node.js, MongoDB, MQTT, React.js, and React Native for communication, monitoring, and user control.",

  {

   "hri24": false,
   "summary": "A framework for robotic dustbins with GPS monitoring, waste segregation, and priority-based collection scheduling for smart cities.",
   "relevance": "Focuses on scheduling and city-scale infrastructure — BinGo operates at a single-user scale.",
   "writeup": {
    "objective": "To propose an Automated Robotic Dustbin (ARD) framework for improving garbage collection in smart cities by reducing manual work, monitoring garbage levels and locations, segregating waste, and using fixed and priority-based scheduling to make collection more time- and fuel-efficient.",
    "methods": "The proposed ARD uses GPS, Wi-Fi, and four sensors to detect garbage on the ground, classify waste as dry or biodegradable, monitor the garbage level, and track the robot's location. The system has three layers: Server Layer, Smart Dustbin Layer, and Client Layer. When the garbage level reaches a predefined threshold (e.g., 98%), the ARD moves to a predefined dropping point and returns for another collection cycle. Two scheduling approaches are proposed: Fixed Scheduling using a fixed collection interval and Priority Scheduling, where areas are assigned priorities and collected at different intervals.",
    "results": "The paper presents a framework rather than an implemented experimental prototype, so quantitative performance results are not reported. The proposed priority scheduling assigns different collection intervals based on area priority—for example, hospitals are assigned a higher priority and shorter collection intervals than offices, societies, and college/school campuses. The authors state that the approach can reduce collection time, fuel usage, and manual intervention.",
    "conclusions": "The proposed ARD framework combines robotic garbage collection, waste segregation, GPS monitoring, IoT connectivity, and scheduling algorithms to improve garbage management. The authors conclude that fixed and priority scheduling can provide flexibility in garbage collection while reducing the need for workers to directly handle waste.",
    "limitations": "The main limitation is that the paper describes a proposed framework and future implementation, rather than providing experimental validation. The authors also note that the system requires supporting infrastructure for implementation. Sensor-based garbage detection and segregation may require maintenance, particularly because sensors and cables inside the dustbin can be affected by wet waste. The paper also does not provide detailed accuracy, navigation performance, or real-world testing results."

  {
   "id": "n5",
   "owner": "m3",
   "title": "Intelligent Route Planning for Autonomous Service Robots using Communicating Smart Dustbins",
   "authors": "",
   "venue": "",
   "year": "",
   "link": "",
   "hri24": false,
   "summary": "Uses smart dustbins that communicate fill levels to a robot, which then plans efficient collection routes via Knapsack + TSP.",
   "relevance": "Route optimization for a collection robot — BinGo instead reacts to one user at a time.",
   "writeup": {
    "objective": "To improve the efficiency of autonomous waste collection robots by using smart dustbins that communicate their garbage filling levels. The goal is to reduce unnecessary trips, energy consumption, and unused robot capacity during garbage collection.",
    "methods": "The system uses the MURMEL autonomous waste collection robot together with smart dustbins equipped with filling-level sensors and LoRaWAN communication. The dustbins send their filling information to a central planning system. A route-planning algorithm combines a Knapsack algorithm to select dustbins according to their filling levels and the robot's capacity, and a Travelling Salesman Problem (TSP) solver to determine the shortest route. The system was evaluated using a SUMO simulation of 52 dustbins in an urban park.",
    "results": "Compared with route planning without filling-level communication, the proposed approach: Reduced total travel distance by 13.12% Reduced the number of trips from 17 to 12 (29.41% reduction) Increased robot capacity utilization from 68.53% to 97.08% (41.67% improvement) Reduced energy consumption from 1.84 kWh to 1.60 kWh (13.12% reduction) The simulation showed that knowing which dustbins are empty or nearly full helped the robot avoid unnecessary visits and use its collection capacity more effectively.",
    "conclusions": "The study demonstrates that communication between smart dustbins and autonomous waste collection robots can improve route planning and resource utilization. The proposed combination of smart-bin filling information, Knapsack-based selection, and TSP-based routing can help reduce travel distance and energy consumption while improving the use of the robot's waste capacity.",
    "limitations": "The evaluation was based on a simulation of 52 dustbins in an urban park, rather than a large-scale real-world deployment. The energy model considers mainly the robot's traction energy and neglects communication energy because its contribution was considered minor. The authors also identify the need to consider dynamic environments, such as a moving mothership, in future route planning."
   }

  {
   "id": "n6",
   "owner": "m3",
   "title": "Modelling and Simulation of Autonomous Indoor Robotic Wastebin in Webots for Waste Management in Smart Buildings",
   "authors": "",
   "venue": "",
   "year": "",
   "link": "",
   "hri24": false,
   "summary": "A Webots-simulated line-following robotic wastebin that navigates to a collection point and coordinates with a second bin.",
   "relevance": "Simulation-only study with line-following — BinGo targets real-world, person-following behavior.",
   "writeup": {
    "objective": "The objective of this paper is to develop and simulate an autonomous indoor robotic waste bin that can automatically move to a common waste collection point when it becomes full. The system is designed to reduce human effort, time, and cost while improving waste collection and management in smart buildings.",
    "methods": "The proposed system is modeled and simulated using the Webots virtual simulator. A line-following navigation technique is used to guide the robotic bin along a predefined path. Infrared sensors detect the line, while color sensors are used at junctions to select the appropriate direction. Distance or ultrasonic sensors are used to detect and avoid obstacles. The robot is modeled as a four-wheeled skid-steer mobile robot with motors, sensors, an Arduino Mega controller, and a NodeMCU for communication. Two robotic bins are simulated, where the first bin travels to the collection point and communicates with the second bin through an emitter-receiver system. The Webots environment contains walls, static obstacles, a dynamic obstacle, and predefined paths.",
    "results": "The simulation showed that the robotic bin could successfully follow the predefined line and navigate toward the collection point while avoiding both static and dynamic obstacles. When the first bin reached the collection point, it sent a signal to the second bin, which then followed the same path toward the first bin's original position. The study also found that the IR-based distance sensor provided better accuracy and faster response than the color sensor tested during the simulation.",
    "conclusions": "The study concludes that an autonomous robotic waste bin using line-following navigation can be successfully modeled and simulated in Webots. The proposed system can navigate to a common collection point, avoid obstacles, and communicate with another robotic bin for replacement. The authors suggest that this approach could be used for smarter and more efficient waste collection in indoor smart-building environments.",
    "limitations": "The main limitation of this study is that the system was evaluated only through simulation and no physical prototype or real-world experimental testing was performed. The robot depends on a predefined line-following path, which limits its navigation flexibility. The color sensor also showed low accuracy and was affected by lighting and shadows. In addition, the system was tested in a controlled Webots environment, so its performance in real indoor environments has not yet been demonstrated. The authors identified real-world implementation and testing as future work"
   }
  },
  {
   "id": "n7",
   "owner": "m3",
   "title": "Automated Indoor Waste Management System Employing Wavefront Algorithm and Received Signal Strength Indicator Values-based Mobile Robot",
   "authors": "",
   "venue": "",
   "year": "",
   "link": "",
   "hri24": false,
   "summary": "A mobile robot that locates full dustbins via Zigbee RSSI, plans paths with the Wavefront algorithm, and empties bins using a robotic arm.",
   "relevance": "RSSI-based localization and grid planning — BinGo uses vision and pose detection to find the requester.",
   "writeup": {
    "objective": "The main objective of this paper is to develop an automated indoor waste management system that reduces the need for manual waste collection. The system uses smart dustbins that can detect when they are full and send information to a mobile robot. The robot then identifies the location of the full dustbin and automatically moves toward it to collect and empty the waste.",
    "methods": "The proposed system consists of three main parts: a smart dustbin, a mobile waste-collecting robot, and a tracking algorithm. The smart dustbin uses two HC-SR04 ultrasonic sensors to detect the amount of waste inside the bin. An Arduino Nano processes the sensor information and sends the status of the dustbin to the robot through Zigbee S2 wireless modules. When a bin becomes full, the robot uses the Received Signal Strength Indicator (RSSI) value to estimate which dustbin is nearby and locate it. For navigation, the Wavefront or Brushfire algorithm creates an X-Y grid of the indoor environment, where walls and obstacles are treated as blocked areas. Infrared sensors are used to detect obstacles and update the robot's map. The robot also contains a robotic arm with servo motors and electromagnets to grip, lift, tilt, and empty the dustbin into its storage box. The system was tested using a 6×6 grid, with each cell measuring 2×2 feet, to evaluate the robot's navigation and shortest-path movement.",
    "results": "The experiments showed that Zigbee provided more stable RSSI values compared with Wi-Fi, making it more suitable for locating the full dustbins. In the 6×6 grid test, the robot was able to find the shortest path to the target location in about 10 seconds. The system also demonstrated relatively low power consumption because the different actuators were not required to operate simultaneously. The smart dustbin required an Arduino Nano, Zigbee module, and ultrasonic sensors, while the mobile robot used various motors, servos, and an electromagnet for waste collection.",
    "conclusions": "The paper concludes that the proposed system can automate indoor waste collection and reduce manual effort, time, and direct human involvement. By combining ultrasonic sensors, Zigbee communication, RSSI-based localization, the Wavefront algorithm, and a mobile robot, the system can detect, locate, collect, and transport waste from full dustbins. The authors also suggest that the system could be further developed for outdoor waste collection, waste segregation, GPS-based localization, image processing, machine learning, and solar-powered operation.",
    "limitations": "The proposed system was tested using a miniature robot and a 6×6 grid rather than a full-scale real indoor environment. The Wavefront algorithm mainly considers 90-degree turns, although the authors mention that 45-degree turns could improve accuracy. RSSI-based localization can also be affected by the indoor environment, and the system depends on Zigbee communication between the dustbins and robot. The authors propose several future improvements, including waste segregation using visual and touch sensors, metal detectors, image processing, and machine learning."
   }
  },

  function pageResearch(){
    return '<section class="page">' +
      '<div class="page-head"><span class="eyebrow">Research plan · draft</span><h2>Objective, gap and questions</h2><p>This is our working draft for weeks 1 and 2. It will change as the literature review grows.</p></div>' +
      '<div class="prose"><span class="eyebrow">Objective</span><p class="objective">Design and build a low-cost autonomous dustbin robot that recognises when a nearby person wants to throw something away, drives to that person, stops at a comfortable distance and opens its lid, then test it with students in a real campus space.</p></div>' +
      '<div class="panel"><h3>Specific objectives</h3><ol class="clean">' +
        '<li>Detect a "throw request" (a hand raised above the shoulder, usually holding an item) in real time from an onboard camera on a Raspberry Pi 4.</li>' +
        '<li>Drive to the person who made the request while avoiding chairs, bags and other people with ultrasonic sensors.</li>' +
        '<li>Stop at a socially comfortable distance, open the lid automatically, detect the rubbish going in and track how full the bin is.</li>' +
        '<li>Evaluate BinGo in a public space at IUB with student users: detection accuracy, time to reach the person and how people rate the experience.</li>' +
      '</ol></div>' +
      '<div class="two"><div class="prose"><h3>Research gap</h3>' +
        '<p>Robotic trash cans have been studied before. An early one was built on a Roomba base and tested at an on-campus cafe . Later, two trash barrel robots were deployed in public plazas in New York City, and most people welcomed them .</p>' +
        '<p>In the New York deployments, though, a hidden researcher drove the robots by remote control. This is called the Wizard of Oz method. The robots never had to decide by themselves who wanted them. These studies tell us a lot about how people react to a moving bin. They say little about how the bin itself can spot a person who wants to throw something away, or whether that works on hardware a student team can afford.</p>' +
        '<p>The deployments we have found so far were all in the United States. BinGo is built and tested at a university in Dhaka.</p>' +
        // '<p class="muted" style="font-size:.9rem">Numbers in brackets refer to the starter papers on the <a href="#literature">Literature</a> page.</p></div>' +

      '<div class="panel soft"><h3>What BinGo adds</h3><ul class="clean"><li>The robot decides on its own, using pose estimation instead of a human driver.</li><li>It runs on about ৳29,000 of parts from Dhaka shops.</li><li>It speaks Bangla and shows simple eyes, so people can tell what it is doing.</li><li>It is tested with students in a South Asian campus setting.</li></ul></div></div>' +
      '<div><span class="eyebrow">Research questions</span>' +
        '<div class="rq" style="margin-top:12px"><span class="rq-id">RQ1</span><p>How reliably can a pose-estimation model running on a Raspberry Pi 4 tell apart a person who wants to throw something away from people who are just moving around?</p></div>' +
        '<div class="rq"><span class="rq-id">RQ2</span><p>At what approach speed and stopping distance do students feel comfortable when a bin comes to them?</p></div>' +
        '<div class="rq"><span class="rq-id">RQ3</span><p>Do simple social cues, animated eyes and a short Bangla voice line, make students more willing to use the bin than when it moves silently?</p></div>' +
      '</div>' +
      '<div style="display:grid;gap:14px"><h3>How we will measure it</h3><div class="table-wrap"><table><thead><tr><th>Measure</th><th>How</th><th>Our target</th></tr></thead><tbody>' +
        '<tr><td>Request detection</td><td>Precision and recall on recorded clips and live trials</td><td class="mono">85% or better</td></tr>' +
        '<tr><td>Time to reach</td><td>Seconds from raised hand to open lid, person 3 m away</td><td class="mono">under 10 s</td></tr>' +
        '<tr><td>Stopping distance</td><td>Measured with a tape on the floor</td><td class="mono">0.6 to 1.0 m</td></tr>' +
        '<tr><td>Collisions</td><td>Count per test session</td><td class="mono">0</td></tr>' +
        '<tr><td>User rating</td><td>Short survey after use: comfort, usefulness, would use again (5 point scale)</td><td class="mono">20+ students</td></tr>' +
        '<tr><td>Effect of social cues (RQ3)</td><td>Same test with eyes and voice turned on, then off</td><td class="mono">compare ratings</td></tr>' +
      '</tbody></table></div></div>' +
      // '<div class="panel note"><h3>Scope for this semester</h3><p>Indoors on flat floors, one request at a time, good lighting. No stairs, no outdoor use and no sorting of recyclables. A 10 to 15 L bin, so BinGo suits a cafeteria corner or corridor, not a whole floor.</p></div>' +
    '</section>';
  }

  function pageSystem(){
    var steps = [
      ["Watch","The Pi camera streams at about 10 frames per second. MediaPipe Pose finds each person and the positions of their shoulders and wrists."],
      ["Recognise","A wrist held above the shoulder for about one second counts as a request. Where the person is in the frame tells BinGo which way to turn."],
      ["Approach","The Pi sends turn and drive commands to the ESP32 over USB serial. Three ultrasonic sensors make it stop or steer around obstacles."],
      ["Stop and open","BinGo stops at the target distance, judged from the person's size in the frame and the front ultrasonic sensor. The servo lifts the lid."],
      ["Confirm","An IR sensor sees the rubbish drop in. The speaker plays \"Dhonnobad!\" and the lid closes after a few seconds."],
      ["Report","A sensor under the lid measures the fill level. When the bin is nearly full, the screen says so and BinGo stops taking requests."]
    ];
    var flow = steps.map(function(s,i){ return '<div class="step"><span class="step-n">Step ' + (i+1) + '</span><h3>' + s[0] + '</h3><p>' + s[1] + '</p></div>'; }).join("");
    return '<section class="page">' +
      '<div class="page-head"><span class="eyebrow">How it works</span><h2>From a raised hand to an open lid</h2><p>BinGo repeats the same six steps for every request.</p></div>' +
      '<div class="flow">' + flow + '</div>' +
      '<div style="display:grid;gap:14px"><h3>Two brains, one robot</h3><p class="muted" style="max-width:66ch">The Raspberry Pi does the heavy vision work. The ESP32 handles motors and sensors, so driving stays smooth while the Pi is busy with the camera.</p>' +
      '<div class="arch">' +
        '<div class="panel"><span class="eyebrow">Raspberry Pi 4 (4 GB)</span><h3>Sees and decides</h3><div class="chip-list"><span class="chip">Pi Camera Module 3</span><span class="chip">MediaPipe Pose</span><span class="chip">Request detection</span><span class="chip">Target tracking</span><span class="chip">Bangla voice clips</span><span class="chip">Amplifier and speaker</span></div></div>' +
        '<div class="arch-link"><span>USB serial</span><span class="wire" aria-hidden="true"></span><span>commands and sensor data</span></div>' +
        '<div class="panel"><span class="eyebrow">ESP32 DevKit</span><h3>Moves and senses</h3><div class="chip-list"><span class="chip">4 motors via 2 × TB6612FNG</span><span class="chip">3 obstacle sensors</span><span class="chip">MPU6050 gyro</span><span class="chip">Lid servo</span><span class="chip">IR drop sensor</span><span class="chip">Fill level sensor</span><span class="chip">OLED eyes</span></div></div>' +
      '</div></div>' +
      '<div class="two"><div class="panel"><h3>Software</h3><ul class="clean"><li>Raspberry Pi OS (64 bit), Python 3</li><li>MediaPipe Pose (MoveNet Lightning as a backup)</li><li>OpenCV for the camera feed, pyserial for the link to the ESP32</li><li>ESP32 firmware in C++ with the Arduino framework</li></ul></div>' +
      '<div class="panel"><h3>Power</h3><ul class="clean"><li>3 × 18650 cells (3S) with a BMS board</li><li>XL4015 at 5 V for the Pi, since it needs a steady 3 A</li><li>One LM2596 at 5 V for the ESP32 and sensors, one at 6 V for the servo</li><li>Expected run time about 1 to 2 hours, enough for a class demo or a test session</li></ul></div></div>' +
    '</section>';
  }

          block("Conclusions", w.conclusions) +
          block("Limitations", w.limitations) +
          (p.summary ? '<div><h4>Short summary</h4><p>' + esc(p.summary) + '</p></div>' : '') +
          (p.relevance ? '<div><h4>For BinGo</h4><p>' + esc(p.relevance) + '</p></div>' : '') +
        '</div>' +
        '<div class="modal-foot">' +
          (link ? '<a class="btn small" href="' + esc(link) + '" target="_blank" rel="noopener">Open source</a>' : '<span></span>') +
          '<button class="btn small primary" type="button" id="paper-modal-done">Close</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  var noticeTimer = null;
  function notice(msg){
    var n = document.getElementById("notice");
    if (!n){ n = document.createElement("div"); n.id = "notice"; n.className = "notice"; n.setAttribute("role","status"); document.body.appendChild(n); }
    n.textContent = msg; n.hidden = false;
    clearTimeout(noticeTimer); noticeTimer = setTimeout(function(){ n.hidden = true; }, 7000);
  }

  function render(keepScroll){
    var y = window.scrollY;
    var cur = current();
    var body;
    if (cur === "hardware") {
      body = pageHardwareComingSoon();
    } else {
      body = {home:pageHome,team:pageTeam,research:pageResearch,system:pageSystem,literature:pageLiterature,updates:pageUpdates}[cur]();
    }
    app.innerHTML = header() + '<main><div class="wrap">' + body + '</div></main>' +
      '<footer><div class="wrap"><span>BinGo · Robotics course project · Independent University, Bangladesh · 2026</span><span>Domain: Creative Social Robot and Application</span></div></footer>' +
      editbar() + paperModal();
    document.title = "BinGo";
    if (keepScroll) window.scrollTo(0, y);
  }

  function markDirty(){ if (!dirty){ dirty = true; var s = document.getElementById("edit-save"); if (s) s.disabled = false; var p = document.querySelector(".editbar p"); if (p) p.textContent = "You have unsaved changes. Saving updates the site for everyone."; } }

  function onField(e){
    if (!editing) return;
    var t = e.target, f = t.dataset && t.dataset.field;
    if (!f) return;
    if (t.dataset.coll === "team"){ DRAFT.teamNo = t.value; markDirty(); return; }
    var coll = DRAFT[t.dataset.coll]; if (!coll) return;
    var obj = coll.find(function(x){ return x.id === t.dataset.id; }); if (!obj) return;
    obj[f] = t.type === "checkbox" ? t.checked : t.value;
    markDirty();
  }
  document.addEventListener("input", onField);
  document.addEventListener("change", onField);

  function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }

  document.addEventListener("submit", function(e){
    if (!editing) return;
    if (e.target.id === "paper-form"){
      e.preventDefault();
      var title = val("np-title"); if (!title){ notice("Add a title first."); return; }
      DRAFT.papers.push({id:uid("p"),owner:val("np-owner") || "shared",title:title,authors:val("np-authors"),venue:val("np-venue"),year:val("np-year"),link:val("np-link"),hri24:!!(document.getElementById("np-hri")||{}).checked,summary:val("np-summary"),relevance:val("np-rel")});
      markDirty(); render(true); notice("Paper added. Press Save changes to keep it.");
    } else if (e.target.id === "update-form"){
      e.preventDefault();
      var wk = val("nu-week"); if (!wk){ notice("Give the update a week label."); return; }
      DRAFT.updates.push({id:uid("u"),week:wk,date:val("nu-date"),done:val("nu-done"),next:val("nu-next"),blockers:val("nu-block")});
      markDirty(); render(true); notice("Update added. Press Save changes to keep it.");
    }
  });

  document.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest("button, [data-open-paper]") : null;
    if (t && t.dataset && t.dataset.openPaper){
      openPaperId = t.dataset.openPaper;
      render(true);
      var closeBtn = document.getElementById("paper-modal-close");
      if (closeBtn) closeBtn.focus();
      return;
    }
    if (e.target && e.target.id === "paper-modal-overlay"){
      openPaperId = null; render(true); return;
    }
    if (!t || t.tagName !== "BUTTON") return;
    if (t.id === "paper-modal-close" || t.id === "paper-modal-done"){
      openPaperId = null; render(true); return;
    }
    if (t.id === "edit-start"){ DRAFT = JSON.parse(JSON.stringify(STATE)); editing = true; dirty = false; render(true); return; }
    if (t.id === "edit-cancel"){ editing = false; dirty = false; DRAFT = null; render(true); return; }
    if (t.id === "edit-save"){ save(); return; }
    if (t.id === "add-member"){ DRAFT.members.push({id:uid("m"),name:"",sid:"",leader:"",role:"",linkedin:"",github:"",researchgate:"",intro:"",photo:""}); markDirty(); render(true); return; }
    if (t.dataset.remove && editing){
      var c = t.dataset.remove, id = t.dataset.id;
      DRAFT[c] = DRAFT[c].filter(function(x){ return x.id !== id; });
      if (c === "members"){ DRAFT.papers.forEach(function(p){ if (p.owner === id) p.owner = "shared"; }); }
      markDirty(); render(true);
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && openPaperId){ openPaperId = null; render(true); }
  });

  window.addEventListener("hashchange", function(){ render(false); window.scrollTo(0,0); });

  function buildDoc(state){
    var css = document.getElementById("bingo-css").textContent;
    var js = document.getElementById("bingo-js").textContent;
    var json = JSON.stringify(state, null, 1).replace(/</g, "\\u003c");
    var sc = "<" + "/script>";
    return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>BinGo</title>" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"stylesheet\" href=\"" + FONTS + "\">" +
      "<style id=\"bingo-css\">" + css + "</style></head><body><div id=\"app\"></div>" +
      "<script type=\"application/json\" id=\"bingo-state\">" + json + sc +
      "<script id=\"bingo-js\">" + js + sc + "</body></html>";
  }

  function save(tried){
    if (!ART || saving) return;
    saving = true; render(true);
    ART.publish(buildDoc(DRAFT)).then(function(){
      notice("Saved. The page is reloading with your changes.");
    }).catch(function(err){
      saving = false;
      var code = err && err.code;
      if (code === "conflict"){ notice("Someone else saved a newer version first."); render(true); return; }
      if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed"){
        readOnly = true; editing = false; DRAFT = null; dirty = false; render(true);
        notice("This view is read-only."); return;
      }
      if (code === "rate_limited"){ render(true); notice("Too many saves. Wait a minute."); return; }
      if (code === "too_large"){ render(true); notice("The site is too large to save."); return; }
      if (!tried){ setTimeout(function(){ save(true); }, 800 + Math.random()*1200); return; }
      render(true); notice("Saving failed. Your edits are still here.");
    });
  }

  render(false);

  try {
    if (window.claude && typeof window.claude.use === "function"){
      window.claude.use("artifact").then(function(ns){ if (ns){ ART = ns; if (!editing) render(true); } }).catch(function(){});
    }
  } catch (e) {}
})();
</script>

</body>
</html>
